name: RELEASE-05a technical checks

on:
  push:
    branches:
      - revision/cageo-d-26-01398-reproducibility
    paths:
      - '**.py'
      - '**.sh'
      - 'requirements*.txt'
      - '.github/workflows/release-technical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Static validation
        run: python scripts/check_release.py --static-only --report outputs/validation/static.json
      - name: Install manuscript-compatible CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.*' 'pandas==2.3.*' 'matplotlib==3.7.*' 'scikit-learn==1.6.*' 'PyWavelets==1.4.*' 'scipy>=1.7' 'openpyxl>=3.1'
          python -m pip install -r requirements.txt
          python -m pip check
          mkdir -p outputs/validation
          python -m pip freeze > outputs/validation/pip-freeze.txt
      - name: Runtime module and CLI validation
        run: python scripts/check_release.py --report outputs/validation/technical.json
      - name: Coverage tool checks without field inputs
        run: |
          python scripts/run_b7_gr_embargo.py --dry-run
          python scripts/audit_861_depth_indices.py --row-count 87
          python scripts/aggregate_861_tables.py --self-test
      - name: Preserve technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-05a-technical
          path: outputs/validation/
          if-no-files-found: warn
