name: RELEASE-05b synthetic benchmarks
on:
  push:
    branches:
      - revision/cageo-d-26-01398-reproducibility
    paths:
      - '.github/workflows/release-synthetic.yml'
      - 'scripts/check_synthetic_smoke.py'
      - 'scripts/run_synthetic_smoke.sh'
      - '**.py'
      - 'requirements*.txt'
      - 'data/synthetic/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
      - name: Install validated CPU dependency versions
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'pandas==2.3.3' 'matplotlib==3.7.5' 'scikit-learn==1.6.1' 'PyWavelets==1.4.1' 'scipy==1.15.3' 'openpyxl==3.1.5'
          python -m pip check
          mkdir -p outputs/validation
          python -m pip freeze > outputs/validation/pip-freeze.txt
      - name: Execute synthetic benchmarks
        run: bash scripts/run_synthetic_smoke.sh
      - name: Verify synthetic artifacts and metrics
        run: python scripts/check_synthetic_smoke.py
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-05b-synthetic
          path: |
            outputs/validation/
            outputs/synthetic_smoke/
          if-no-files-found: warn
